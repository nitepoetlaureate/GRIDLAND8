<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRIDLAND</title>
    <link rel="stylesheet" href="/src/frontend/style.css" />
  </head>
  <body>
    <div id="hud">
      <header>
        <span class="brand">GRIDLAND</span>
        <span id="status" class="status">connecting…</span>
      </header>
      <section id="panel">
        <div class="row">
          <label>lat<input id="lat" type="number" step="0.001" value="39.9526" /></label>
          <label>lon<input id="lon" type="number" step="0.001" value="-75.1652" /></label>
          <label>radius (km)<input id="radius" type="number" step="1" value="25" min="1" max="200" /></label>
          <button id="go">scan</button>
        </div>
        <div class="row view-presets">
          <span class="view-label">view</span>
          <button type="button" data-view="street" title="~350 m — street level">street</button>
          <button type="button" data-view="neighborhood" title="~2.5 km">area</button>
          <button type="button" data-view="metro" title="~12 km">metro</button>
          <button type="button" data-view="orbit" title="~50 km">orbit</button>
        </div>
        <div id="counts" class="counts"></div>
        <fieldset class="layers">
          <legend>Layers</legend>
          <label><input type="checkbox" data-layer="cameras" checked /> Cameras</label>
          <label><input type="checkbox" data-layer="context-pois" checked /> Civic / context POIs</label>
          <label><input type="checkbox" data-layer="aircraft" checked /> Aircraft</label>
          <label><input type="checkbox" data-layer="transit" /> SEPTA live transit (Philly)</label>
          <label><input type="checkbox" data-layer="indego" /> Indego bike share (Philly)</label>
          <label><input type="checkbox" data-layer="satellites" /> Satellites (ISS+stations)</label>
          <label><input type="checkbox" data-layer="gibs-truecolor" /> Clouds (MODIS true color)</label>
          <label><input type="checkbox" data-layer="gibs-fires" /> Active fires (VIIRS)</label>
          <label><input type="checkbox" data-layer="gibs-aerosol" /> Aerosol (MODIS AOD)</label>
        </fieldset>
        <div id="context" class="context"></div>
        <div id="whats-here" class="whats-here" hidden></div>
      </section>
    </div>
    <div id="cesium-container"></div>
    <script type="module" src="/src/frontend/main.js"></script>
  </body>
</html>
